<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>モニター案件登録</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    background: #f5f5f5;
    color: #333;
    font-size: 16px;
  }
  h1 {
    background: #4a90d9;
    color: white;
    padding: 16px 20px;
    font-size: 18px;
    font-weight: 600;
  }
  .subtitle {
    background: #4a90d9;
    color: rgba(255,255,255,0.85);
    padding: 0 20px 12px;
    font-size: 13px;
  }
  .form-wrap { padding: 16px; max-width: 600px; margin: 0 auto; }

  /* GAS URL section */
  .gas-section {
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .gas-section label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
  .gas-section input {
    width: 100%; border: 1px solid #ddd; border-radius: 6px;
    padding: 8px 10px; font-size: 14px;
  }
  .gas-hint { font-size: 11px; color: #aaa; margin-top: 4px; }

  /* Section headers */
  .section-label {
    font-size: 13px; font-weight: 600; color: #555;
    background: #eee; border-left: 3px solid #4a90d9;
    padding: 6px 10px; margin: 16px 0 10px; border-radius: 0 4px 4px 0;
  }

  /* Form fields */
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 13px; color: #555; margin-bottom: 4px; font-weight: 500;
  }
  .field label .req { color: #e53935; font-size: 12px; margin-left: 2px; }
  .field select, .field input[type=text], .field input[type=date],
  .field input[type=number], .field textarea {
    width: 100%; border: 1px solid #ddd; border-radius: 8px;
    padding: 10px 12px; font-size: 15px; background: white;
    appearance: auto; -webkit-appearance: auto;
    font-family: inherit;
  }
  .field select { cursor: pointer; }
  .field input[readonly] { background: #f0f4ff; color: #555; }
  .field textarea { min-height: 80px; resize: vertical; }

  /* Submit button */
  .btn-submit {
    display: block; width: 100%;
    background: #4a90d9; color: white;
    border: none; border-radius: 10px;
    padding: 14px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 20px;
    font-family: inherit;
  }
  .btn-submit:active { background: #357abd; }

  /* Result message */
  #result {
    margin-top: 12px; padding: 12px; border-radius: 8px;
    font-size: 14px; text-align: center; display: none;
  }
  #result.ok { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  #result.ng { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
</style>
</head>
<body>

<h1>モニター案件登録</h1>
<div class="subtitle">iPhoneからスプレッドシートに直接登録</div>

<div class="form-wrap">

  <!-- GAS URL -->
  <div class="gas-section">
    <label>GAS WebアプリURL</label>
    <input type="text" id="gas-url" placeholder="https://script.google.com/macros/s/..." />
    <div class="gas-hint">※ 一度入力すると保存されます</div>
  </div>

  <!-- 基本情報 -->
  <div class="section-label">基本情報</div>

  <div class="field">
    <label>会社名<span class="req">*</span></label>
    <select id="company">
      <option value="">選択してください</option>
      <option>e GIFT</option>
      <option>e GIFT VIP</option>
      <option>スキマde調査隊！</option>
      <option>プレモニ</option>
      <option>JOB LINK</option>
      <option>モニたま</option>
      <option>アマレポ</option>
      <option>コエくる！</option>
      <option>SEASON</option>
      <option>ためしてGo!</option>
      <option>VOICE</option>
      <option>ringo🍎</option>
    </select>
  </div>

  <div class="field">
    <label>案件名<span class="req">*</span></label>
    <input type="text" id="project" placeholder="案件名を入力">
  </div>

  <!-- 購入情報 -->
  <div class="section-label">購入情報</div>

  <div class="field">
    <label>購入先<span class="req">*</span></label>
    <select id="shop" onchange="calcArrival()">
      <option value="">選択してください</option>
      <option value="Amazon">Amazon</option>
      <option value="楽天">楽天</option>
      <option value="Yahoo!ショッピング">Yahoo!ショッピング</option>
      <option value="TikTok shop">TikTok shop</option>
      <option value="その他">その他</option>
    </select>
  </div>

  <div class="field">
    <label>購入方法</label>
    <select id="pay-method">
      <option value="">選択してください</option>
      <option>Amazonギフト</option>
      <option>Amazonポイント</option>
      <option>楽天ポイント</option>
      <option>Olive G</option>
      <option>NL G</option>
      <option>エポス</option>
      <option>メルカリ</option>
      <option>アメックス</option>
      <option>VIEW</option>
      <option>楽天カード</option>
      <option>その他</option>
    </select>
  </div>

  <div class="field">
    <label>購入日<span class="req">*</span></label>
    <input type="date" id="buy-date" onchange="calcArrival()">
  </div>

  <div class="field">
    <label>購入金額（円）</label>
    <input type="number" id="buy-price" placeholder="0">
  </div>

  <div class="field">
    <label>到着予定日 <span style="font-size:11px;color:#aaa;">（購入先選択で自動計算）</span></label>
    <input type="date" id="arrival-date" readonly>
  </div>

  <!-- 報酬・その他 -->
  <div class="section-label">報酬・その他</div>

  <div class="field">
    <label>報酬（円）</label>
    <input type="number" id="reward" placeholder="0">
  </div>

  <div class="field">
    <label>定期解約</label>
    <select id="cancel">
      <option value="ー（なし）">ー（なし）</option>
      <option value="必須">必須</option>
    </select>
  </div>

  <div class="field">
    <label>購入回（e GIFT系）<span class="req">*</span></label>
    <select id="purchase-count">
      <option value="">選択してください</option>
      <option>第1回</option>
      <option>第2回</option>
      <option>第3回</option>
      <option>第4回</option>
      <option>第5回</option>
      <option>第6回</option>
      <option>第7回</option>
      <option>第8回</option>
      <option>第9回</option>
      <option>第10回</option>
      <option>第11回</option>
      <option>第12回</option>
      <option>第13回</option>
      <option>第14回</option>
      <option>第15回</option>
      <option>第16回</option>
      <option>第17回</option>
      <option>第18回</option>
      <option>第19回</option>
      <option>第20回</option>
    </select>
  </div>

  <div class="field">
    <label>管理番号</label>
    <input type="text" id="mgmt-no" placeholder="管理番号">
  </div>

  <div class="field">
    <label>メモ</label>
    <textarea id="memo" placeholder="メモ"></textarea>
  </div>

  <button class="btn-submit" onclick="submitForm()">登録する</button>
  <div id="result"></div>

</div><!-- /form-wrap -->

<script>
// ── GAS URL: localStorage に保存 ────────────────────────────
const GAS_KEY = 'monitor_gas_url';
const gasInput = document.getElementById('gas-url');

// 保存済み URL を読み込み
gasInput.value = localStorage.getItem(GAS_KEY) || '';
gasInput.addEventListener('change', () => {
  localStorage.setItem(GAS_KEY, gasInput.value.trim());
});

// ── 到着予定日の自動計算 ────────────────────────────────────
// 購入先ごとの日数（Amazonは翌日 = +1）
const DELIVERY_DAYS = {
  'Amazon': 1,
  '楽天': 3,
  'Yahoo!ショッピング': 3,
  'TikTok shop': 7,
  'その他': 3
};

function calcArrival() {
  const shopVal  = document.getElementById('shop').value;
  const buyDate  = document.getElementById('buy-date').value;
  const arrInput = document.getElementById('arrival-date');

  if (!shopVal || !buyDate) { arrInput.value = ''; return; }

  const days = DELIVERY_DAYS[shopVal];
  if (days == null) { arrInput.value = ''; return; }

  const d = new Date(buyDate);
  d.setDate(d.getDate() + days);
  arrInput.value = d.toISOString().split('T')[0];
}

// ── フォーム送信 ────────────────────────────────────────────
function submitForm() {
  const gasUrl = gasInput.value.trim();
  if (!gasUrl) {
    showResult('GAS WebアプリURLを入力してください', false);
    return;
  }

  // 必須チェック
  const company = document.getElementById('company').value;
  const project = document.getElementById('project').value.trim();
  const shop    = document.getElementById('shop').value;
  const buyDate = document.getElementById('buy-date').value;

  if (!company) { showResult('会社名を選択してください', false); return; }
  if (!project) { showResult('案件名を入力してください', false); return; }
  if (!shop)    { showResult('購入先を選択してください', false); return; }
  if (!buyDate) { showResult('購入日を入力してください', false); return; }

  // データ収集
  const params = new URLSearchParams({
    company:       company,
    project:       project,
    shop:          shop,
    payMethod:     document.getElementById('pay-method').value,
    buyDate:       buyDate,
    buyPrice:      document.getElementById('buy-price').value,
    arrivalDate:   document.getElementById('arrival-date').value,
    reward:        document.getElementById('reward').value,
    cancel:        document.getElementById('cancel').value,
    purchaseCount: document.getElementById('purchase-count').value,
    mgmtNo:        document.getElementById('mgmt-no').value,
    memo:          document.getElementById('memo').value,
  });

  const btn = document.querySelector('.btn-submit');
  btn.disabled = true;
  btn.textContent = '送信中…';

  fetch(gasUrl, { method: 'POST', body: params })
    .then(r => r.text())
    .then(text => {
      showResult('✅ 登録しました！', true);
      clearForm();
    })
    .catch(err => {
      // GETフォールバック（CORS対策）
      const url = gasUrl + '?' + params.toString();
      fetch(url, { mode: 'no-cors' })
        .then(() => { showResult('✅ 登録しました！', true); clearForm(); })
        .catch(() => showResult('❌ 送信に失敗しました。URLを確認してください。', false));
    })
    .finally(() => {
      btn.disabled = false;
      btn.textContent = '登録する';
    });
}

function showResult(msg, ok) {
  const el = document.getElementById('result');
  el.textContent = msg;
  el.className = ok ? 'ok' : 'ng';
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

function clearForm() {
  ['company','project','shop','pay-method','buy-date','buy-price',
   'arrival-date','reward','purchase-count','mgmt-no','memo']
    .forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
  document.getElementById('cancel').value = 'ー（なし）';
}
</script>
</body>
</html>

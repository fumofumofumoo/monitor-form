<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --purple: #7C5CBF;
  --purple-light: #A07EDE;
  --pink: #F06292;
  --orange: #FF8A65;
  --teal: #4DB6AC;
  --bg: #EDE7F6;
  --card: #ffffff;
  --text: #2d2d2d;
  --muted: #888;
  --radius: 18px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  background: linear-gradient(160deg, #EDE7F6 0%, #E8EAF6 50%, #FCE4EC 100%);
  min-height: 100vh;
  color: var(--text);
  padding-bottom: 40px;
}

/* HEADER */
.header {
  padding: 48px 20px 20px;
  text-align: center;
}
.header-emoji { font-size: 40px; margin-bottom: 10px; display: block; }
.header h1 {
  font-size: 26px; font-weight: 800; color: var(--purple);
  letter-spacing: -0.5px; margin-bottom: 6px;
}
.header p { font-size: 13px; color: var(--muted); }

/* WRAP */
.wrap { max-width: 480px; margin: 0 auto; padding: 0 16px; }

/* SECTION BADGE */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
  margin: 20px 0 10px;
}
.badge.purple { background: var(--purple); color: white; }
.badge.orange { background: var(--orange); color: white; }
.badge.teal   { background: var(--teal);   color: white; }

/* CARD */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px 16px;
  margin-bottom: 12px;
  box-shadow: 0 4px 16px rgba(124,92,191,0.10);
}

/* FIELD */
.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field label {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.8px;
  margin-bottom: 6px;
}
.field label .req { color: var(--pink); font-size: 14px; line-height: 1; }
.field select,
.field input[type=text],
.field input[type=date],
.field input[type=number],
.field textarea {
  width: 100%;
  border: 2px solid #EDE7F6;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 15px;
  color: var(--text);
  background: #FAFAFA;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  appearance: auto;
  -webkit-appearance: auto;
}
.field select:focus,
.field input:focus,
.field textarea:focus {
  border-color: var(--purple-light);
  background: white;
}
.field input[readonly] {
  background: #F3E5F5;
  color: var(--purple);
  border-color: #E1BEE7;
  font-weight: 600;
}
.field textarea { resize: vertical; min-height: 80px; }

/* TWO COL */
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.two-col > .field { min-width: 0; }
.two-col > .field input,
.two-col > .field select { max-width: 100%; min-width: 0; }

/* iOS Safariのdate入力は固有幅を持ち width:100% を超えてはみ出すため、ネイティブ外観を外す */
.field input[type=date] {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  min-width: 0;
  min-height: 48px;
  text-align: left;
}
.field input[type=date]::-webkit-date-and-time-value { text-align: left; }

/* SUBMIT */
.btn-wrap { padding: 8px 0 4px; }
.btn-submit {
  display: block; width: 100%;
  background: linear-gradient(135deg, var(--purple) 0%, var(--purple-light) 100%);
  color: white; border: none; border-radius: 16px;
  padding: 16px; font-size: 17px; font-weight: 800;
  cursor: pointer; font-family: inherit;
  box-shadow: 0 6px 20px rgba(124,92,191,0.35);
  letter-spacing: 0.5px;
  transition: transform 0.1s, box-shadow 0.1s;
}
.btn-submit:active {
  transform: scale(0.98);
  box-shadow: 0 2px 10px rgba(124,92,191,0.25);
}

/* RESULT */
#result {
  margin-top: 12px; padding: 14px; border-radius: 14px;
  font-size: 14px; text-align: center; font-weight: 600;
  display: none;
}
#result.ok { background: #E8F5E9; color: #2E7D32; }
#result.ng { background: #FFEBEE; color: #C62828; }

/* GAS settings — hidden, accessible via long press on title */
.gas-hidden {
  display: none;
  background: #F3E5F5; border-radius: 14px; padding: 14px; margin-bottom: 12px;
}
.gas-hidden.show { display: block; }
.gas-hidden label { font-size: 11px; color: var(--purple); font-weight: 700; display: block; margin-bottom: 6px; }
.gas-hidden input {
  width: 100%; border: 2px solid #CE93D8; border-radius: 10px;
  padding: 10px 12px; font-size: 13px; background: white; font-family: inherit; outline: none;
}
.gas-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
.settings-hint { text-align: center; font-size: 11px; color: #bbb; padding: 4px 0 12px; }
</style>
</head>
<body>

<div class="header">
  <span class="header-emoji">📋</span>
  <h1>モニター案件登録</h1>
  <p>iPhoneからスプレッドシートに直接登録</p>
</div>

<div class="wrap">

  <!-- GAS URL (hidden, tap title 3x to show) -->
  <div class="gas-hidden" id="gas-section">
    <label>🔧 GAS WebアプリURL</label>
    <input type="text" id="gas-url" placeholder="https://script.google.com/macros/s/...">
    <div class="gas-hint">※ 一度入力すると保存されます</div>
  </div>
  <div class="settings-hint" id="settings-hint">タイトルを3回タップで設定を表示</div>

  <!-- 基本情報 -->
  <div class="badge purple">🏢 基本情報</div>

  <div class="card">
    <div class="field">
      <label>会社名 <span class="req">*</span></label>
      <select id="company">
        <option value="">選択してください</option>
        <option>e GIFT</option>
        <option>e GIFT VIP</option>
        <option>スキマde調査隊！</option>
        <option>プレモニ</option>
        <option>JOB LINK</option>
        <option>モニたま</option>
        <option>アマレポ</option>
        <option>コエくる！</option>
        <option>SEASON</option>
        <option>ためしてGo!</option>
        <option>VOICE</option>
        <option>ringo🍎</option>
      </select>
    </div>
    <div class="field">
      <label>案件名 <span class="req">*</span></label>
      <input type="text" id="project" placeholder="案件名を入力">
    </div>
  </div>

  <!-- 購入情報 -->
  <div class="badge orange">🛒 購入情報</div>

  <div class="card">
    <div class="field">
      <label>購入先 <span class="req">*</span></label>
      <select id="shop" onchange="calcArrival()">
        <option value="">選択してください</option>
        <option value="Amazon">Amazon</option>
        <option value="楽天">楽天</option>
        <option value="Yahoo!ショッピング">Yahoo!ショッピング</option>
        <option value="TikTok shop">TikTok shop</option>
        <option value="その他">その他</option>
      </select>
    </div>
    <div class="field">
      <label>購入方法</label>
      <select id="pay-method">
        <option value="">選択してください</option>
        <option>Amazonギフト</option>
        <option>Amazonポイント</option>
        <option>楽天ポイント</option>
        <option>Olive G</option>
        <option>NL G</option>
        <option>エポス</option>
        <option>メルカリ</option>
        <option>アメックス</option>
        <option>VIEW</option>
        <option>楽天カード</option>
        <option>その他</option>
      </select>
    </div>
    <div class="two-col">
      <div class="field">
        <label>購入日 <span class="req">*</span></label>
        <input type="date" id="buy-date" onchange="calcArrival()">
      </div>
      <div class="field">
        <label>到着予定日</label>
        <input type="date" id="arrival-date" readonly>
      </div>
    </div>
    <div class="field">
      <label>購入金額（円）</label>
      <input type="number" id="buy-price" placeholder="0">
    </div>
  </div>

  <!-- 報酬・その他 -->
  <div class="badge teal">💰 報酬・その他</div>

  <div class="card">
    <div class="two-col">
      <div class="field">
        <label>報酬（円）</label>
        <input type="number" id="reward" placeholder="0">
      </div>
      <div class="field">
        <label>定期解約</label>
        <select id="cancel">
          <option value="ー（なし）">ー（なし）</option>
          <option value="必須">必須</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>購入回（e GIFT系）</label>
      <select id="purchase-count">
        <option value="">選択してください</option>
        <option>第1回</option><option>第2回</option><option>第3回</option>
        <option>第4回</option><option>第5回</option><option>第6回</option>
        <option>第7回</option><option>第8回</option><option>第9回</option>
        <option>第10回</option><option>第11回</option><option>第12回</option>
        <option>第13回</option><option>第14回</option><option>第15回</option>
        <option>第16回</option><option>第17回</option><option>第18回</option>
        <option>第19回</option><option>第20回</option>
      </select>
    </div>
    <div class="field">
      <label>管理番号</label>
      <input type="text" id="mgmt-no" placeholder="管理番号">
    </div>
    <div class="field">
      <label>メモ</label>
      <textarea id="memo" placeholder="メモ"></textarea>
    </div>
  </div>

  <div class="btn-wrap">
    <button class="btn-submit" onclick="submitForm()">✨ 登録する</button>
    <div id="result"></div>
  </div>

</div><!-- /wrap -->

<script>
// ── GAS URL (localStorage) ───────────────────────────────────
const GAS_KEY = 'monitor_gas_url';
const gasInput = document.getElementById('gas-url');
const savedUrl = localStorage.getItem(GAS_KEY) || '';
gasInput.value = savedUrl;

// GAS URLが未設定なら自動で設定欄を表示
if (!savedUrl) {
  document.getElementById('gas-section').classList.add('show');
  document.getElementById('settings-hint').style.display = 'none';
}

// iOS Safariではchangeが発火しないためblurも使う
function saveGasUrl() { localStorage.setItem(GAS_KEY, gasInput.value.trim()); }
gasInput.addEventListener('change', saveGasUrl);
gasInput.addEventListener('blur', saveGasUrl);

// タイトルを3回タップで設定表示
let tapCount = 0, tapTimer;
document.querySelector('.header h1').addEventListener('click', () => {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => tapCount = 0, 800);
  if (tapCount >= 3) {
    tapCount = 0;
    const s = document.getElementById('gas-section');
    const h = document.getElementById('settings-hint');
    s.classList.toggle('show');
    h.style.display = s.classList.contains('show') ? 'none' : 'block';
  }
});

// ── 到着予定日 ───────────────────────────────────────────────
const DELIVERY = { 'Amazon':1, '楽天':3, 'Yahoo!ショッピング':3, 'TikTok shop':7, 'その他':3 };
function calcArrival() {
  const shop = document.getElementById('shop').value;
  const date = document.getElementById('buy-date').value;
  const arr  = document.getElementById('arrival-date');
  if (!shop || !date) { arr.value = ''; return; }
  const d = new Date(date);
  d.setDate(d.getDate() + (DELIVERY[shop] || 3));
  arr.value = d.toISOString().split('T')[0];
}

// ── 送信 ─────────────────────────────────────────────────────
function submitForm() {
  const gasUrl = gasInput.value.trim();
  if (!gasUrl) { showResult('⚙️ タイトルを3回タップしてURLを設定してください', false); return; }

  const company = document.getElementById('company').value;
  const project = document.getElementById('project').value.trim();
  const shop    = document.getElementById('shop').value;
  const buyDate = document.getElementById('buy-date').value;

  if (!company) { showResult('会社名を選択してください', false); return; }
  if (!project) { showResult('案件名を入力してください', false); return; }
  if (!shop)    { showResult('購入先を選択してください', false); return; }
  if (!buyDate) { showResult('購入日を入力してください', false); return; }

  const params = new URLSearchParams({
    company, project, shop,
    payMethod:     document.getElementById('pay-method').value,
    buyDate,
    buyPrice:      document.getElementById('buy-price').value,
    arrivalDate:   document.getElementById('arrival-date').value,
    reward:        document.getElementById('reward').value,
    cancel:        document.getElementById('cancel').value,
    purchaseCount: document.getElementById('purchase-count').value,
    mgmtNo:        document.getElementById('mgmt-no').value,
    memo:          document.getElementById('memo').value,
  });

  const btn = document.querySelector('.btn-submit');
  btn.disabled = true; btn.textContent = '送信中…';

  // GASの応答（{result, row} / {result, message}）を確認してから結果を表示する
  fetch(gasUrl, { method: 'POST', body: params })
    .then(res => res.json())
    .then(data => {
      if (data.result === 'success') {
        showResult(`✅ 登録しました！（${data.row}行目）`, true);
        clearForm();
      } else {
        showResult(`❌ 登録に失敗しました：${data.message || '不明なエラー'}`, false);
      }
    })
    .catch(() => showResult('❌ 送信に失敗しました。URLとGASのデプロイ設定を確認してください。', false))
    .finally(() => { btn.disabled = false; btn.textContent = '✨ 登録する'; });
}

function showResult(msg, ok) {
  const el = document.getElementById('result');
  el.textContent = msg; el.className = ok ? 'ok' : 'ng'; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

function clearForm() {
  ['company','project','shop','pay-method','buy-date','buy-price',
   'arrival-date','reward','purchase-count','mgmt-no','memo']
    .forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
  document.getElementById('cancel').value = 'ー（なし）';
}
</script>
</body>
</html>
